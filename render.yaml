services:
  - type: keyvalue
    name: merebhub-keygen-redis
    plan: starter
    ipAllowList: []
    maxmemoryPolicy: noeviction
    persistenceMode: journal-snapshot

  - type: pserv
    name: merebhub-keygen-api
    runtime: docker
    dockerfilePath: ./Dockerfile.keygen
    dockerContext: .
    plan: starter
    dockerCommand: bundle exec puma -C config/puma.rb
    preDeployCommand: bundle exec rails db:migrate
    envVars:
      - key: KEYGEN_EDITION
        value: CE
      - key: KEYGEN_MODE
        value: singleplayer
      - key: KEYGEN_HOST
        sync: false
      - key: KEYGEN_HOSTS
        sync: false
      - key: KEYGEN_ACCOUNT_ID
        sync: false
      - key: KEYGEN_ADMIN_EMAIL
        sync: false
      - key: KEYGEN_ADMIN_PASSWORD
        sync: false
      - key: KEYGEN_ADMIN_TOKEN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: merebhub-keygen-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: merebhub-keygen-redis
          property: connectionString
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: ENCRYPTION_PRIMARY_KEY
        generateValue: true
      - key: ENCRYPTION_DETERMINISTIC_KEY
        generateValue: true
      - key: ENCRYPTION_KEY_DERIVATION_SALT
        generateValue: true
      - key: RAILS_ENV
        value: production
      - key: RAILS_SERVE_STATIC_FILES
        value: enabled
      - key: RAILS_LOG_TO_STDOUT
        value: enabled

  - type: worker
    name: merebhub-keygen-worker
    runtime: docker
    dockerfilePath: ./Dockerfile.keygen
    dockerContext: .
    plan: starter
    dockerCommand: bundle exec sidekiq -C config/sidekiq.yml
    envVars:
      - key: KEYGEN_EDITION
        value: CE
      - key: KEYGEN_MODE
        value: singleplayer
      - key: KEYGEN_HOST
        sync: false
      - key: KEYGEN_HOSTS
        sync: false
      - key: KEYGEN_ACCOUNT_ID
        sync: false
      - key: KEYGEN_ADMIN_EMAIL
        sync: false
      - key: KEYGEN_ADMIN_PASSWORD
        sync: false
      - key: KEYGEN_ADMIN_TOKEN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: merebhub-keygen-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: merebhub-keygen-redis
          property: connectionString
      - key: SECRET_KEY_BASE
        fromService:
          type: pserv
          name: merebhub-keygen-api
          envVarKey: SECRET_KEY_BASE
      - key: ENCRYPTION_PRIMARY_KEY
        fromService:
          type: pserv
          name: merebhub-keygen-api
          envVarKey: ENCRYPTION_PRIMARY_KEY
      - key: ENCRYPTION_DETERMINISTIC_KEY
        fromService:
          type: pserv
          name: merebhub-keygen-api
          envVarKey: ENCRYPTION_DETERMINISTIC_KEY
      - key: ENCRYPTION_KEY_DERIVATION_SALT
        fromService:
          type: pserv
          name: merebhub-keygen-api
          envVarKey: ENCRYPTION_KEY_DERIVATION_SALT
      - key: RAILS_ENV
        value: production
      - key: RAILS_SERVE_STATIC_FILES
        value: enabled
      - key: RAILS_LOG_TO_STDOUT
        value: enabled

  - type: web
    name: merebhub-middleware-api
    runtime: docker
    dockerfilePath: ./middleware/Dockerfile
    dockerContext: ./middleware
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: merebhub-keygen-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: merebhub-keygen-redis
          property: connectionString
      - key: KEYGEN_API_HOSTPORT
        fromService:
          type: pserv
          name: merebhub-keygen-api
          property: hostport
      - key: KEYGEN_ACCOUNT_ID
        sync: false
      - key: KEYGEN_ADMIN_TOKEN
        sync: false
      - key: WOOCOMMERCE_URL
        sync: false
      - key: WOOCOMMERCE_CONSUMER_KEY
        sync: false
      - key: WOOCOMMERCE_CONSUMER_SECRET
        sync: false
      - key: CHAPA_SECRET_KEY
        sync: false
      - key: CHAPA_PUBLIC_KEY
        sync: false
      - key: CHAPA_ENCRYPTION_KEY
        sync: false

databases:
  - name: merebhub-keygen-db
    databaseName: keygen_production
    user: keygen_pg_user
    plan: starter
    ipAllowList: []
